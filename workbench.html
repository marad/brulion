<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brulion — extension workbench</title>
  </head>
  <body class="workbench-page">
    <main id="workbench" aria-labelledby="workbench-title">
      <header class="workbench-titlebar">
        <div class="workbench-product">
          <span class="workbench-product-mark" aria-hidden="true">B</span>
          <div class="workbench-product-copy">
            <h1 id="workbench-title">Extension editor</h1>
            <p id="workbench-vault"></p>
          </div>
        </div>
        <section id="workbench-status" class="workbench-status" role="status"></section>
        <div class="workbench-titlebar-actions">
          <button id="workbench-refresh" class="workbench-button workbench-button-quiet" type="button">Refresh</button>
          <button id="workbench-kit" class="workbench-button workbench-button-quiet" type="button">Authoring kit</button>
        </div>
      </header>

      <section id="workbench-missing" class="workbench-recovery" hidden>
        <div class="workbench-recovery-card">
          <span class="workbench-recovery-icon" aria-hidden="true">⌁</span>
          <h2>Workspace access required</h2>
          <p id="workbench-missing-message"></p>
          <button id="workbench-choose-folder" class="workbench-button workbench-button-primary" type="button">Open workspace…</button>
        </div>
      </section>

      <section id="workbench-content" class="workbench-workspace" hidden>
        <aside class="workbench-sidebar" aria-label="Extension explorer">
          <header class="workbench-sidebar-header">
            <h2>Explorer</h2>
          </header>

          <section class="workbench-tree-section" aria-labelledby="workbench-extensions-heading">
            <div class="workbench-tree-heading">
              <h3 id="workbench-extensions-heading">Extensions</h3>
              <div class="workbench-heading-actions">
                <button id="workbench-delete-script" class="workbench-icon-button" type="button" aria-label="Delete selected extension" title="Delete selected extension" disabled>−</button>
                <button id="workbench-create-script" class="workbench-icon-button" type="button" aria-label="New extension" title="New extension">＋</button>
              </div>
            </div>
            <label class="workbench-sr-only" for="workbench-script-select">Active extension</label>
            <select id="workbench-script-select" class="workbench-script-select" aria-label="Active extension"></select>
          </section>

          <section class="workbench-tree-section workbench-files-section" aria-labelledby="workbench-files-heading">
            <div class="workbench-tree-heading">
              <h3 id="workbench-files-heading">Files</h3>
              <div class="workbench-heading-actions">
                <button id="workbench-delete-file-shortcut" class="workbench-icon-button" type="button" aria-label="Delete selected file" title="Delete selected file" disabled>−</button>
                <button id="workbench-create-file" class="workbench-icon-button" type="button" aria-label="New file" title="New file">＋</button>
              </div>
            </div>
            <div id="workbench-file-list" class="workbench-list workbench-file-list"></div>
          </section>
        </aside>

        <section class="workbench-editor-panel" aria-label="Extension editor">
          <header class="workbench-editor-toolbar">
            <span id="workbench-file-icon" class="workbench-sr-only" aria-hidden="true">—</span>
            <h2 id="workbench-file-title" class="workbench-editor-title">Select a file</h2>
            <p class="workbench-breadcrumb"><span>extensions</span><span aria-hidden="true"> / </span><span id="workbench-script-context">No extension selected</span></p>
            <div class="workbench-editor-actions">
              <details class="workbench-file-menu">
                <summary aria-label="File actions" title="File actions">•••</summary>
                <div class="workbench-menu-body">
                  <label for="workbench-rename-file-input">Move selected file</label>
                  <input id="workbench-rename-file-input" type="text" placeholder="New file path" aria-label="New file path" disabled />
                  <button id="workbench-rename-file" class="workbench-button" type="button" disabled>Move file</button>
                  <button id="workbench-delete-file" class="workbench-button workbench-button-danger" type="button" disabled>Delete file</button>
                </div>
              </details>
              <button id="workbench-save" class="workbench-button workbench-button-primary" type="button" disabled>Save</button>
            </div>
          </header>

          <div id="workbench-editor"></div>
          <footer class="workbench-statusbar">
            <div class="workbench-statusbar-left">
              <p id="workbench-diagnostic" class="workbench-diagnostic" role="alert"></p>
              <p id="workbench-file-status"></p>
            </div>
            <div class="workbench-statusbar-right" aria-label="Editor information">
              <span id="workbench-language">Plain text</span>
              <span>UTF-8</span>
              <span>Ctrl/Cmd + S</span>
            </div>
          </footer>
        </section>
      </section>

      <section id="workbench-create-dialog" class="workbench-dialog-backdrop" hidden>
        <form class="workbench-dialog" role="dialog" aria-modal="true" aria-labelledby="workbench-create-title">
          <h2 id="workbench-create-title">Create</h2>
          <p id="workbench-create-description" class="workbench-dialog-description" hidden></p>
          <label id="workbench-create-label" for="workbench-create-input">Name</label>
          <input id="workbench-create-input" type="text" autocomplete="off" />
          <p id="workbench-create-error" class="workbench-dialog-error" role="alert" hidden></p>
          <div class="workbench-dialog-actions">
            <button id="workbench-create-cancel" class="workbench-button" type="button">Cancel</button>
            <button id="workbench-create-confirm" class="workbench-button workbench-button-primary" type="submit">Create</button>
          </div>
        </form>
      </section>

      <section id="workbench-kit-panel" class="workbench-kit-drawer" hidden>
        <div class="workbench-kit-panel" role="complementary" aria-labelledby="workbench-kit-title">
          <header class="workbench-kit-header">
            <div>
              <h2 id="workbench-kit-title">Authoring kit <span id="workbench-kit-version"></span></h2>
              <p>Versioned references for extension authors and coding agents.</p>
            </div>
            <button id="workbench-kit-close" class="workbench-icon-button" type="button" aria-label="Close authoring kit">×</button>
          </header>
          <div id="workbench-kit-list" class="workbench-list workbench-kit-list"></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/workbench-main.ts"></script>
  </body>
</html>
